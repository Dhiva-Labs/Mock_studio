name: mock_studio
description: "Mock Studio by dhiva labs - a production-grade mock server for building, exposing and testing HTTP endpoints."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # HTTP server
  shelf: ^1.4.2

  # Storage & paths
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Files
  file_picker: ^10.0.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  http: ^1.5.0

  # QR code for LAN sharing to phones
  qr_flutter: ^4.1.0

  # YAML parsing for OpenAPI import
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
