# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (tool/build_deb.sh).

NAME=mockstudio              # package name, the same as the .deb's
APP_NAME=MockStudio          # AppImage file name
GITHUB_REPO=Dhiva-Labs/Mock_studio
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Production mock server for building and testing HTTP endpoints'
DESCRIPTION='Design HTTP endpoints visually, start a real server, and share it on your LAN or over a public tunnel. Conditional rules, response sequences, templating, fault injection, proxy recording and OpenAPI import - friendly enough for non-developers.'
MAINTAINER='Dhivakar R <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/Mock_studio
LICENSE=MIT                  # SPDX id
# The repository has no LICENSE file; the Debian copyright file carries the
# copyright line and the MIT text.
LICENSE_FILE=linux/packaging/debian/copyright

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# when the build machine has a JDK, as the CI runners do, and it links that
# machine's libjvm.so by absolute path. Nothing loads it on desktop Linux,
# and shipping it would make the rpm require a JVM.
EXCLUDE=(usr/lib/mockstudio/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. The
# Flutter engine also dlopens EGL and GLES 2 (libepoxy), which no ELF file
# lists, and aborts without them, so they are named here as rpm soname
# capabilities. Then the tools the app runs: path_provider asks
# xdg-user-dir for the Documents folder, where the projects are saved, and
# the app looks for cloudflared/ngrok with which. cloudflared and ngrok
# themselves are optional and not in the distributions' repositories.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)' /usr/bin/xdg-user-dir /usr/bin/which)
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest;
# libglvnd is the dlopened EGL/GLES 2.
ARCH_DEPENDS=(gtk3 libglvnd xdg-user-dirs which)
ARCH_INDEPENDENT=0

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/mockstudio/mock_studio
DESKTOP=usr/share/applications/mockstudio.desktop
ICON=usr/share/icons/hicolor/256x256/apps/mockstudio.png
APPRUN_ENV=''                # /usr/bin/mockstudio is a plain link
# Host libraries and tools the AppImage relies on besides GTK 3, like the
# packages' RPM_REQUIRES (Fedora names, installed for the AppImage check):
# every desktop has them, a minimal container does not.
APPIMAGE_HOST_PKGS='libglvnd-egl libglvnd-gles xdg-user-dirs which'

# Smoke tests run in each distribution container by verify.sh.
GUI_CMD=mockstudio           # must still be running after SMOKE_SECONDS under Xvfb
SMOKE_SECONDS=20
# The same proof as the .deb smoke run: the native runner's window title,
# and the sample project Dart start-up saves into <Documents>/MockStudio
# (a `find -path` pattern under $HOME), which shows the AOT snapshot ran.
SMOKE_WINDOW='^Mock Studio$'
SMOKE_DATA_PATH='*MockStudio/projects/*.json'
SMOKE_CMD=''
